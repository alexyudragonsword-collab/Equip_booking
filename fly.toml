# Fly.io deployment config
# Usage:
#   1. fly launch --no-deploy            (creates the app, edit values below if needed)
#   2. fly volumes create booking_data --region <region> --size 1
#   3. fly secrets set SECRET_KEY=<random> ADMIN_EMAIL=<email> ADMIN_PASSWORD=<pw>
#   4. fly deploy

app = "equip-booking"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  FLASK_ENV = "production"
  FORCE_HTTPS = "1"
  DATABASE_URL = "sqlite:////data/booking.db"

[[mounts]]
  source = "booking_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
