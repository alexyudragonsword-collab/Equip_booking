{% extends 'base.html' %}
{% block title %}Register – Instrument Booking{% endblock %}

{% block content %}
<div class="auth-card">
  <h1>Create Account</h1>
  <p class="auth-subtitle">Register to start booking instruments</p>

  <form method="post" action="{{ url_for('auth.register') }}" novalidate id="registerForm">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required autofocus
             value="{{ name or '' }}" placeholder="Jane Smith">
    </div>

    <div class="form-group">
      <label for="department">Department</label>
      <input type="text" id="department" name="department" required
             value="{{ department or '' }}" placeholder="Physics / Chemistry / ...">
    </div>

    <div class="form-group">
      <label for="phone">Phone <small>(optional)</small></label>
      <input type="tel" id="phone" name="phone"
             value="{{ phone or '' }}" placeholder="+1 555 000 0000">
    </div>

    <div class="form-group">
      <label for="supervisor_name">Supervisor Name <small>(optional)</small></label>
      <input type="text" id="supervisor_name" name="supervisor_name"
             value="{{ supervisor_name or '' }}" placeholder="Prof. Jane Smith">
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required
             value="{{ email or '' }}" placeholder="you@example.com">
    </div>

    <div class="form-group">
      <label for="password">Password <small>(min 8 characters)</small></label>
      <input type="password" id="password" name="password" required placeholder="••••••••" minlength="8">
    </div>

    <div class="form-group">
      <label for="confirm_password">Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password" required placeholder="••••••••">
      <span class="field-error" id="passwordError"></span>
    </div>

    <button type="submit" class="btn btn-primary btn-full">Create Account</button>
  </form>

  <p class="auth-link">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', function(e) {
  const pw = document.getElementById('password').value;
  const cpw = document.getElementById('confirm_password').value;
  const err = document.getElementById('passwordError');
  if (pw !== cpw) {
    e.preventDefault();
    err.textContent = 'Passwords do not match.';
  } else {
    err.textContent = '';
  }
});
</script>
{% endblock %}
