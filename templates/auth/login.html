{% extends 'base.html' %}
{% block title %}Login – SHARE Instrument Booking System{% endblock %}

{% block content %}
<div class="auth-logo-wrap">
  <img src="{{ url_for('static', filename='images/share_logo.webp') }}" alt="SHARE" class="auth-logo-img">
</div>
<div class="auth-card">
  <h1>Sign In</h1>
  <p class="auth-subtitle">Access the instrument booking system</p>

  <form method="post" action="{{ url_for('auth.login') }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus
             value="{{ request.form.get('email', '') }}" placeholder="you@example.com">
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required placeholder="••••••••">
    </div>

    <button type="submit" class="btn btn-primary btn-full">Sign In</button>
  </form>

  <p class="auth-link">Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
</div>
{% endblock %}
